# Nixpacks configuration for Railway backend deployment
# Governed by: part1_discovery_engine_implementation_spec.md (Section 21)

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = ["pip install -r backend/requirements.txt"]

[start]
cmd = "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port ${PORT:-8000}"
